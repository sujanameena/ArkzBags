<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkzBags</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="index-mobile.css">
</head>

<body>

<header class="site-header">
    <div class="logo">Arkz<span>Bags</span></div>

    <input type="checkbox" id="nav-trigger" class="nav-trigger" aria-label="Toggle navigation">
    <label for="nav-trigger" class="nav-toggle">☰</label>

    <nav aria-label="Main">
        <ul class="nav-menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Collections</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</header>

<style>
/* Remove default page gaps so header is full-bleed */
html, body {
    margin: 0;
    padding: 0;
}

.site-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0.75rem 1.25rem;
    background:#111;
    color:#fff;
    position:sticky;
    top:0;
    left:0;
    right:0;
    width:100%;
    margin:0;
    z-index:1000;
    box-shadow:0 2px 4px rgba(0,0,0,.3);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
.logo { font-size:1.5rem; font-weight:700; letter-spacing:.5px; }
.logo span { color:#e6b800; }
.nav-trigger { display:none; }
.nav-toggle {
    display:none;
    cursor:pointer;
    font-size:1.6rem;
    padding:.25rem .6rem;
    line-height:1;
    border-radius:4px;
    user-select:none;
}
.nav-toggle:hover { background:#222; }
.nav-menu {
    list-style:none;
    display:flex;
    gap:1.5rem;
    margin:0;
    padding:0;
}
.nav-menu a {
    color:#fff;
    text-decoration:none;
    font-weight:500;
    position:relative;
    padding:.35rem 0;
}
.nav-menu a::after {
    content:'';
    position:absolute;
    left:0;
    bottom:-4px;
    width:0;
    height:2px;
    background:#e6b800;
    transition:.3s;
}
.nav-menu a:hover::after,
.nav-menu a:focus::after { width:100%; }

@media (max-width:800px) {
    .nav-toggle { display:block; }
    nav { width:100%; }
    .nav-menu {
        position:absolute;
        top:100%;
        left:0;
        right:0;
        background:#111;
        flex-direction:column;
        max-height:0;
        overflow:hidden;
        transition:max-height .35s ease;
        border-top:1px solid #222;
    }
    .nav-menu li { border-bottom:1px solid #222; }
    .nav-menu a { padding:1rem 1.25rem; display:block; }
    .nav-trigger:checked + .nav-toggle + nav .nav-menu { max-height:400px; }
}
</style>

    <script src="index.js"></script>
</body>

</html>
